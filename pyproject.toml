[project]
name = "ai-manager"
version = "1.2.8"
description = "AI Manager：签到 / 会话 / 账号一体化桌面工作台"
authors = [{ name = "FaustDream" }]
# 授权条款见仓库根目录 LICENSE：可自由使用与分发原版，不得去除署名后再分发
requires-python = ">=3.10"
dependencies = [
    # 只用 QtCore/QtGui/QtWidgets/QtSvg，essentials 足够；
    # 装完整 PySide6 会多带 addons + webengine + pdf，体积多出约 450MB
    "pyside6-essentials>=6.8,<7",
    "requests>=2.31,<3",
    "cryptography>=42,<51",
]

# 这是应用而不是要发布的库：不需要 build-system，uv 只负责建环境与装依赖
[tool.uv]
package = false
