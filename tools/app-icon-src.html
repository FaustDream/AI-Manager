<!doctype html>
<!-- AI Manager 应用图标源：IconPark grid-nine（工作台）+ 主色圆角渐变底。
     Edge headless 截图 1024×1024 后交给 tauri icon 生成全套。 -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .tile {
    width: 1024px; height: 1024px;
    border-radius: 224px;
    background: linear-gradient(180deg, #2f6ef0 0%, #1d4ed8 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 6px 24px rgba(255,255,255,.18);
    box-sizing: border-box;
  }
  .tile svg { width: 640px; height: 640px; display: block; }
</style>
</head>
<body>
<div class="tile">
  <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="5" y="5" width="38" height="38" rx="10" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5 18H43" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M5 30H43" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M17 5V43" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M30 5V43" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </svg>
</div>
</body>
</html>
