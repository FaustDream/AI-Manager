<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>AI Manager</title>
    <!--
      启动画面：样式必须内联。
      原因：index.css 是打包产物的一部分，等它加载完才画，中间就是一片白；
      这段 HTML 在 webview 解析到这里时立刻上屏，React 挂载后再淡出。
      配色取四套风格的真实画布/文字/主色值，见 src/index.css 的令牌表。
    -->
    <script>
      // 风格真源在后端 kv，首屏这一刻还读不到；用上一次落地的提示值先上色，
      // 暗色风格的用户才不会先被闪一屏白。读不到就按系统深浅色兜底。
      try {
        var hint = localStorage.getItem('aim.ui.theme');
        if (hint) document.documentElement.setAttribute('data-splash', hint);
      } catch (e) {
        /* 隐私模式读不到 localStorage：走系统兜底 */
      }
    </script>
    <style>
      :root {
        --splash-bg: #f3f5f9;
        --splash-fg: #1c2430;
        --splash-muted: #6b7684;
        --splash-line: #e4e8f0;
        --splash-accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-splash]) {
          --splash-bg: #0a0c12;
          --splash-fg: #e8ebf2;
          --splash-muted: #8b95a9;
          --splash-line: #262c3d;
          --splash-accent: #8b6bff;
        }
      }
      [data-splash='tech'] {
        --splash-bg: #0a0c12;
        --splash-fg: #e8ebf2;
        --splash-muted: #8b95a9;
        --splash-line: #262c3d;
        --splash-accent: #8b6bff;
      }
      [data-splash='soft'] {
        --splash-bg: #f1f0fb;
        --splash-fg: #2b2a45;
        --splash-muted: #7b7899;
        --splash-line: #e6e3f5;
        --splash-accent: #6366f1;
      }
      [data-splash='minimal'] {
        --splash-bg: #f2eee5;
        --splash-fg: #332e26;
        --splash-muted: #8a8070;
        --splash-line: #e3dccd;
        --splash-accent: #a05a2c;
      }
      html,
      body {
        margin: 0;
        background: var(--splash-bg);
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        background: var(--splash-bg);
        font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--splash-fg);
        transition: opacity 0.22s ease-out;
      }
      #splash[data-hide] {
        opacity: 0;
      }
      .splash-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 1px solid var(--splash-line);
        border-radius: 9px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--splash-muted);
        animation: splash-breathe 2.4s ease-in-out infinite;
      }
      .splash-name {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .splash-track {
        width: 132px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: var(--splash-line);
      }
      .splash-track > span {
        display: block;
        width: 38%;
        height: 100%;
        border-radius: 2px;
        background: var(--splash-accent);
        animation: splash-slide 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(320%);
        }
      }
      @keyframes splash-breathe {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark,
        .splash-track > span {
          animation: none;
        }
        .splash-track > span {
          width: 100%;
          opacity: 0.45;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-mark">AI</div>
      <div class="splash-name">AI Manager</div>
      <div class="splash-track"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
