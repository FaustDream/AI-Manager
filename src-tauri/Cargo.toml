[package]
name = "ai-manager"
version = "2.0.37"
edition = "2021"
description = "AI Manager：签到 / 会话 / 技能分发一体化工作台（本机后端 + 浏览器界面）"

# 依赖按能力收敛：只保留账号、签到、会话、技能四条业务链真正用到的组件。
[lib]
name = "ai_manager"
path = "src/lib.rs"

# 唯一入口：本机后端（HTTP 壳 + 静态托管），界面在浏览器里
[[bin]]
name = "ai-manager"
path = "src/bin/ai-manager.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# 解各家客户端的登录态（Chromium 式 v10 信封：DPAPI 取密钥 + AES-256-GCM）
aes-gcm = "0.10"
# WorkBuddy 固定密钥 / ZCode 密钥推导 / Trae iCube 种子（纯 Rust，几十 KB）
sha2 = "0.10"
# Trae iCube 是 AES-128-CBC（另一家是 GCM，不能共用）
cbc = "0.1"
# 重新封 Chromium 信封时的 nonce（系统 CSPRNG）
getrandom = "0.2"
# 签到 / 积分的唯一网络库；Windows 上 native-tls = schannel，
# 不引入 OpenSSL、也不用 rustls（那套会多背 1MB 以上）
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
# 豆包浏览器登录：CDP over WebSocket（连临时 Chrome/Edge 会话，只走 ws:// 明文，不开 TLS）
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
futures-util = "0.3"
# HTTP 壳：hyper 已在依赖树（reqwest 传递），axum 只是薄封装
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# SSE 事件流要把 broadcast Receiver 转成 Stream
tokio-stream = { version = "0.1", features = ["sync"] }
# 只开用得到的特性：windows crate 的元数据很大，全开会显著拖慢编译
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",      # DPAPI：CryptProtectData / CryptUnprotectData
    "Win32_Security_Credentials",       # 凭据管理器：读 ZCode 客户端 v2:os 的密钥条目
    "Win32_System_Diagnostics_ToolHelp",# 进程快照：检测客户端是否运行
    "Win32_System_Threading",           # CreateProcessW：静默启动，不弹控制台
    "Win32_System_Console",             # AttachConsole：release 无控制台，CLI 输出接父控制台
    "Win32_System_Registry",            # 开机自启写 HKCU Run
    "Win32_Storage_FileSystem",         # MoveFileExW：替换登录票据不留中间态
    "Win32_UI_WindowsAndMessaging",     # FindWindowW / SetForegroundWindow：二次启动唤出已有窗口
    "Win32_UI_Shell",                   # ShellExecuteW：用默认浏览器打开登录页
] }
# D8 类型同步：仅 ts feature 下编译，默认构建 / release 产物不含它。
# cargo test --features ts 时把全部 IPC 载荷类型生成到 ../src/lib/types/，
# CI 里用 git status 校验「生成物 = 提交物」。用 v8：i64 生成 number（v10 起改成 bigint）。
ts-rs = { version = "8", optional = true, features = ["serde-compat", "chrono-impl", "no-serde-warnings"] }
# 应用配置文件（data/config.toml）
toml = "0.8"

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = "3"

# 单进程架构下 abort 会杀掉整个进程，绝不能配。
[profile.release]
panic = "unwind"
opt-level = "s"
lto = true
strip = true
