[package]
name = "ai-manager"
version = "1.5.0"
edition = "2021"
description = "AI Manager：签到 / 会话 / 技能分发一体化桌面工作台"

# P0 阶段刻意不引入 tauri：本阶段只做契约测试与注入点，
# tauri / reqwest / aes-gcm / windows 在 P1~P2 按需加入，避免一开始就背上编译负担。
[lib]
name = "ai_manager"
path = "src/lib.rs"

[[bin]]
name = "ai-manager"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# 解各家客户端的登录态（Chromium 式 v10 信封：DPAPI 取密钥 + AES-256-GCM）
aes-gcm = "0.10"
# WorkBuddy 固定密钥 / ZCode 密钥推导 / Trae iCube 种子（纯 Rust，几十 KB）
sha2 = "0.10"
# Trae iCube 是 AES-128-CBC（另一家是 GCM，不能共用）
cbc = "0.1"
# 重新封 Chromium 信封时的 nonce（系统 CSPRNG）
getrandom = "0.2"
# 只开用得到的特性：tray-icon 托盘、wry 默认 webview；不开 devtools 之外的花哨能力
tauri = { version = "2", features = ["tray-icon"] }
# 签到 / 积分的唯一网络库（ARCHITECTURE-v2 §4）；Windows 上 native-tls = schannel，
# 不引入 OpenSSL、也不用 rustls（那套会多背 1MB 以上）
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# 只开用得到的特性：windows crate 的元数据很大，全开会显著拖慢编译
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",      # DPAPI：CryptProtectData / CryptUnprotectData
    "Win32_System_Diagnostics_ToolHelp",# 进程快照：检测客户端是否运行
    "Win32_System_Threading",           # CreateProcessW：静默启动，不弹控制台
    "Win32_System_Console",             # AttachConsole：release 无控制台，CLI 输出接父控制台
    "Win32_System_Registry",            # 开机自启写 HKCU Run
    "Win32_Storage_FileSystem",         # MoveFileExW：替换登录票据不留中间态
    "Win32_UI_WindowsAndMessaging",     # FindWindowW / SetForegroundWindow：二次启动唤出已有窗口
    "Win32_System_ProcessStatus",       # GetProcessMemoryInfo：内存验收（TASK-CONCURRENCY §9）
] }
# D8 类型同步：仅 ts feature 下编译，默认构建 / release 产物不含它（ARCHITECTURE §6.4）。
# cargo test --features ts 时把全部 IPC 载荷类型生成到 ../src/lib/types/，
# CI 里用 git status 校验「生成物 = 提交物」。用 v8：i64 生成 number（v10 起改成 bigint）。
ts-rs = { version = "8", optional = true, features = ["serde-compat", "chrono-impl", "no-serde-warnings"] }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 见 ARCHITECTURE-v2.md D7：单进程架构下 abort 会杀掉整个进程，绝不能配。
[profile.release]
panic = "unwind"
opt-level = "s"
lto = true
strip = true
