<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>AI Manager</title>
<style>
  :root {
    --bg:#fff; --fg:#1c1f23; --muted:#6b7280; --line:#e5e7eb; --card:#f8fafc;
    --accent:#2563eb; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --hover:#f1f5f9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --fg:#e6e8ec; --muted:#9aa3af; --line:#2a2e37; --card:#1d2026;
            --accent:#5b8cff; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --hover:#23272f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:14px 22px;
           border-bottom:1px solid var(--line); }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .badge { padding:1px 8px; border-radius:999px; border:1px solid var(--line);
           font-size:12px; color:var(--muted); }
  .spacer { flex:1; }
  button { background:transparent; color:var(--fg); border:1px solid var(--line);
           border-radius:8px; padding:5px 12px; font:inherit; font-size:13px; cursor:pointer; }
  button:hover { background:var(--hover); }
  button:disabled { opacity:.45; cursor:default; background:transparent; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.small { padding:2px 8px; font-size:12px; border-radius:6px; }
  main { padding:16px 22px 40px; }
  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  thead th { text-align:left; font-weight:600; font-size:12px; color:var(--muted);
             letter-spacing:.03em; padding:8px 10px; border-bottom:1px solid var(--line);
             position:sticky; top:0; background:var(--bg); user-select:none;
             overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  /* 列宽手柄：贴在表头右边界，宽 7px 才好点中 */
  thead th .rz { position:absolute; right:0; top:0; bottom:0; width:7px; cursor:col-resize; }
  thead th .rz:hover, body.resizing .rz { background:var(--accent); opacity:.35; }
  body.resizing { cursor:col-resize; }
  body.resizing * { user-select:none; }
  tbody td { padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  tbody tr.row { cursor:pointer; }
  tbody tr.row:hover { background:var(--hover); }
  tbody tr.row.selected { background:var(--hover); }
  tbody tr.row td:first-child { cursor:grab; }
  tbody tr.row.dragging { opacity:.4; }
  tbody tr.row.drop-before td { box-shadow:inset 0 2px 0 var(--accent); }
  tbody tr.row.drop-after  td { box-shadow:inset 0 -2px 0 var(--accent); }
  .tag { display:inline-block; padding:1px 8px; border-radius:6px; font-size:12px;
         border:1px solid var(--line); color:var(--muted); }
  .tag.current { border-color:var(--ok); color:var(--ok); }
  .num { font-variant-numeric:tabular-nums; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .dash { color:var(--muted); }
  .empty { padding:44px; text-align:center; color:var(--muted); }
  .detail { margin-top:14px; border:1px solid var(--line); border-radius:10px;
            padding:12px 16px; background:var(--card); }
  .detail h2 { font-size:13px; margin:0 0 8px; font-weight:600; }
  .detail dl { display:grid; grid-template-columns:max-content 1fr; gap:4px 18px; margin:0; }
  .detail dt { color:var(--muted); font-size:12px; }
  .detail dd { margin:0; }
  .toast { position:fixed; right:20px; bottom:20px; background:var(--card);
           border:1px solid var(--line); border-radius:10px; padding:10px 16px;
           box-shadow:0 8px 24px rgba(0,0,0,.12); opacity:0; transition:opacity .2s;
           max-width:520px; white-space:pre-wrap; }
  .toast.show { opacity:1; }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--fg);
           padding:18px 20px; min-width:360px; box-shadow:0 18px 48px rgba(0,0,0,.24); }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  dialog h3 { margin:0 0 8px; font-size:14px; }
  dialog p { margin:0 0 14px; color:var(--muted); font-size:13px; white-space:pre-wrap; }
  dialog .actions { display:flex; gap:8px; justify-content:flex-end; }
  dialog .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
  dialog .grid button { text-align:left; padding:8px 10px; }
</style>
</head>
<body>
<header>
  <h1>账号中心</h1>
  <span class="badge" id="count">—</span>
  <span class="spacer"></span>
  <button id="scan">扫描客户端</button>
  <button id="add">添加账号</button>
  <button id="refresh">刷新</button>
</header>

<main>
  <table>
    <thead>
      <tr id="head"></tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="9" class="empty">加载中…</td></tr>
    </tbody>
  </table>
  <div id="detail"></div>
</main>

<div class="toast" id="toast"></div>

<dialog id="dlg">
  <h3 id="dlg-title">标题</h3>
  <p id="dlg-text"></p>
  <div class="grid" id="dlg-grid"></div>
  <div class="actions">
    <button id="dlg-cancel">取消</button>
    <button class="primary" id="dlg-ok">确定</button>
  </div>
</dialog>

<script>
  const { invoke } = window.__TAURI__.core;
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const RESTART_HINT = '（重新打开客户端即可生效）';

  const fmtDate = ms => {
    if (!ms) return '—';
    const d = new Date(ms), now = new Date();
    const md = `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    return d.getFullYear() === now.getFullYear() ? md : `${d.getFullYear()}-${md}`;
  };
  const fmtFull = ms => ms ? new Date(ms).toLocaleString('zh-CN', { hour12: false }) : '—';

  let toastTimer;
  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 4200);
  }

  // ---- 通用对话框：不用原生 confirm（Tauri 里 alert/confirm 行为不稳定）----
  let dlgResolve = null;
  function ask({ title, text, okText = '确定', cancelText = '取消', options = null }) {
    $('dlg-title').textContent = title;
    $('dlg-text').textContent = text || '';
    const grid = $('dlg-grid');
    grid.innerHTML = options
      ? options.map(o => `<button data-value="${esc(o.key)}">${esc(o.label)}</button>`).join('')
      : '';
    grid.style.display = options ? 'grid' : 'none';
    $('dlg-ok').textContent = okText;
    $('dlg-cancel').textContent = cancelText;
    // 有选项时「确定」没有意义：用户必须选一个平台
    $('dlg-ok').style.display = options ? 'none' : '';
    $('dlg').showModal();
    return new Promise(resolve => { dlgResolve = resolve; });
  }
  function closeDlg(value) {
    $('dlg').close();
    const r = dlgResolve; dlgResolve = null;
    if (r) r(value);
  }
  $('dlg-cancel').onclick = () => closeDlg(null);
  $('dlg-ok').onclick = () => closeDlg(true);

  // ---- 列定义：加一列 = 加一行（表头、单元格、空态 colspan 都从这里来）----
  // w = 默认列宽，min = 拖动时允许的最窄宽度
  const COLUMNS = [
    { key:'platform', label:'平台',   w:110, min:90,
      cell: v => `<span class="tag${v.is_current ? ' current' : ''}">${esc(v.platform_label)}</span>` },
    { key:'name',     label:'昵称',   min:90,
      cell: v => esc(v.name) + (v.is_current ? ' <span class="ok" title="客户端当前登录">●</span>' : '') },
    { key:'source',   label:'登录态', w:140, min:90,
      cell: v => v.source ? `<span class="dash">${esc(v.source)}</span>` : '<span class="dash">—</span>' },
    { key:'status',   label:'状态',   w:110, min:70, cell: v => statusCell(v) },
    { key:'balance',  label:'积分',   w:90,  min:70,
      cell: v => v.balance == null ? '<span class="dash">—</span>' : `<span class="num">${v.balance.toFixed(2)}</span>` },
    { key:'quota',    label:'配额',   w:100, min:70, cell: v => quotaCell(v) },
    { key:'checkin',  label:'签到',   w:100, min:80, cell: v => checkinCell(v) },
    { key:'expires',  label:'到期',   w:105, min:80, cell: v => expiresCell(v) },
    { key:'action',   label:'操作',   w:130, min:110, cell: v => actionCell(v) },
  ];

  // ---- 列宽：拖表头右边界调整，存进 kv（key: ui.columns），重启后还在 ----
  let widths = {};
  let resizing = null;

  function renderHead() {
    $('head').innerHTML = COLUMNS.map(c => {
      const w = widths[c.key] || c.w;
      return `<th data-key="${c.key}"${w ? ` style="width:${w}px"` : ''}>${esc(c.label)}<i class="rz"></i></th>`;
    }).join('');
  }

  $('head').addEventListener('mousedown', e => {
    const handle = e.target.closest('.rz');
    if (!handle) return;
    e.preventDefault();
    const th = handle.parentElement;
    const col = COLUMNS.find(c => c.key === th.dataset.key) || {};
    resizing = { key: th.dataset.key, th, x: e.clientX, w: th.offsetWidth, min: col.min || 64 };
    document.body.classList.add('resizing');
  });

  document.addEventListener('mousemove', e => {
    if (!resizing) return;
    const w = Math.max(resizing.min, Math.round(resizing.w + e.clientX - resizing.x));
    resizing.th.style.width = w + 'px';
    widths[resizing.key] = w;
  });

  document.addEventListener('mouseup', () => {
    if (!resizing) return;
    resizing = null;
    document.body.classList.remove('resizing');
    // 拖完才落盘：拖动过程中每帧写库没有意义
    invoke('settings_set', { key: 'ui.columns', value: widths }).catch(() => {});
  });

  async function loadWidths() {
    try {
      const saved = await invoke('settings_get', { key: 'ui.columns' });
      if (saved && typeof saved === 'object' && !Array.isArray(saved)) {
        widths = saved;
        renderHead();
      }
    } catch (_) { /* 读不到就按默认列宽显示，不影响主流程 */ }
  }

  renderHead();

  function statusCell(v) {
    if (v.error) return `<span class="bad" title="${esc(v.error)}">异常</span>`;
    if (!v.has_secret) return '<span class="warn">待登录</span>';
    if (v.is_current) return '<span class="ok">当前</span>';
    return '<span class="ok">正常</span>';
  }

  function quotaCell(v) {
    const keys = Object.keys(v.quota || {});
    if (!keys.length) return '<span class="dash">—</span>';
    const max = Math.max(...keys.map(k => v.quota[k]));
    return `<span class="num">${Math.round(max)}%</span>`;
  }

  function checkinCell(v) {
    if (!v.requires_checkin) return '<span class="dash">免签</span>';
    if (v.checked_in === true) return `<span class="ok">已签 ${fmtDate(v.checked_at)}</span>`;
    if (v.checked_in === false) return '<span class="warn">待签</span>';
    return '<span class="dash">—</span>';
  }

  function expiresCell(v) {
    if (!v.expires_at) return '<span class="dash">—</span>';
    const expired = v.expires_at <= Date.now();
    return `<span class="${expired ? 'bad' : ''}">${expired ? '已过期 ' : ''}${fmtDate(v.expires_at)}</span>`;
  }

  function actionCell(v) {
    const canSwitch = v.has_secret && !v.is_current;
    return `<button class="small sw" data-iid="${esc(v.iid)}" ${canSwitch ? '' : 'disabled'}>切换</button>
            <button class="small del" data-iid="${esc(v.iid)}">删除</button>`;
  }

  let rows = [];
  let selected = null;
  let dragIid = null;

  // 把拖起来的行插到目标行的前面或后面
  function moveRow(from, to, after) {
    const i = rows.findIndex(r => r.iid === from);
    if (i < 0) return;
    const [moved] = rows.splice(i, 1);
    const j = rows.findIndex(r => r.iid === to);
    rows.splice(j < 0 ? rows.length : after ? j + 1 : j, 0, moved);
  }

  function dropMarks() {
    document.querySelectorAll('tr.drop-before, tr.drop-after')
      .forEach(el => el.classList.remove('drop-before', 'drop-after'));
  }

  function render() {
    const body = $('rows');
    if (!rows.length) {
      body.innerHTML = `<tr><td colspan="${COLUMNS.length}" class="empty">还没有账号。点「扫描客户端」读本地登录态。</td></tr>`;
      $('count').textContent = '0 个账号';
      $('detail').innerHTML = '';
      return;
    }
    body.innerHTML = rows.map(v =>
      `<tr class="row${selected === v.iid ? ' selected' : ''}" data-iid="${esc(v.iid)}">
         ${COLUMNS.map(c => `<td>${c.cell(v)}</td>`).join('')}
       </tr>`).join('');
    $('count').textContent = `${rows.length} 个账号`;

    body.querySelectorAll('tr.row').forEach(tr => {
      tr.onclick = e => {
        if (e.target.closest('button')) return;
        selected = selected === tr.dataset.iid ? null : tr.dataset.iid;
        render();
      };

      // ---- 拖动排序：只认第一格，避免选文字时误拖 ----
      tr.addEventListener('mousedown', e => {
        tr.draggable = !!e.target.closest('td:first-child');
      });
      tr.addEventListener('dragstart', e => {
        dragIid = tr.dataset.iid;
        tr.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      tr.addEventListener('dragend', () => {
        tr.classList.remove('dragging');
        dropMarks();
        dragIid = null;
      });
      tr.addEventListener('dragover', e => {
        if (!dragIid || dragIid === tr.dataset.iid) return;
        e.preventDefault();
        const box = tr.getBoundingClientRect();
        dropMarks();
        tr.classList.add(e.clientY > box.top + box.height / 2 ? 'drop-after' : 'drop-before');
      });
      tr.addEventListener('drop', async e => {
        e.preventDefault();
        const after = tr.classList.contains('drop-after');
        dropMarks();
        if (!dragIid || dragIid === tr.dataset.iid) return;
        moveRow(dragIid, tr.dataset.iid, after);
        dragIid = null;
        render();
        try {
          await invoke('account_reorder', { iids: rows.map(r => r.iid) });
        } catch (err) {
          toast('顺序没保存：' + err);
          load();
        }
      });
    });
    body.querySelectorAll('button.del').forEach(btn => {
      btn.onclick = async () => {
        const ok = await ask({
          title: '从账号库移除？',
          text: '只删本工具的记录，客户端的登录态不会被改动。',
          okText: '移除',
        });
        if (!ok) return;
        await invoke('account_delete', { iid: btn.dataset.iid });
        toast('已移除');
        load();
      };
    });
    body.querySelectorAll('button.sw').forEach(btn => {
      btn.onclick = () => doSwitch(btn.dataset.iid);
    });
    renderDetail();
  }

  // 详情面板：选中行下方展开，不占列
  function renderDetail() {
    const v = rows.find(r => r.iid === selected);
    if (!v) { $('detail').innerHTML = ''; return; }
    const quotaKeys = Object.keys(v.quota || {});
    const quotaText = quotaKeys.length
      ? quotaKeys.map(k => `${esc(k)} ${Math.round(v.quota[k])}%`).join(' · ')
      : '—';
    $('detail').innerHTML = `
      <div class="detail">
        <h2>${esc(v.platform_label)} · ${esc(v.name)}</h2>
        <dl>
          <dt>登录态来源</dt><dd>${v.source ? esc(v.source) : '<span class="dash">来自账号库（未读到客户端文件）</span>'}</dd>
          <dt>凭据</dt><dd>${v.has_secret ? '已加密保存' : '<span class="warn">缺失，需要重新登录</span>'}</dd>
          <dt>到期</dt><dd>${fmtFull(v.expires_at)}</dd>
          <dt>签到</dt><dd>${v.requires_checkin ? (v.checked_in === true ? '今日已签' : v.checked_in === false ? '今日待签' : '未知') : '该平台免签到'}</dd>
          <dt>配额</dt><dd>${quotaText}</dd>
          <dt>最近错误</dt><dd>${v.error ? `<span class="bad">${esc(v.error)}</span>` : '无'}</dd>
        </dl>
      </div>`;
  }

  async function doSwitch(iid) {
    const ok = await ask({
      title: '切换到该账号？',
      text: '会改写客户端登录态（写前自动备份）。客户端必须处于关闭状态。\n切换成功后重新打开客户端即可使用该账号。',
      okText: '切换',
    });
    if (!ok) return;
    try {
      const r = await invoke('account_switch', { iid });
      toast(r.message + RESTART_HINT);
    } catch (e) {
      // Rust 侧返回的是 {kind, message} 的 JSON 字符串
      let msg = String(e);
      try {
        const parsed = JSON.parse(msg);
        if (parsed && parsed.message) msg = parsed.message;
      } catch (_) {}
      toast(msg);
    }
    load();
  }

  async function load() {
    try {
      rows = await invoke('account_list');
      const current = await invoke('account_current').catch(() => []);
      const set = new Set(current);
      rows.forEach(v => { v.is_current = set.has(v.iid); });
      render();
    } catch (e) {
      $('rows').innerHTML = `<tr><td colspan="${COLUMNS.length}" class="empty">读取失败：${esc(e)}</td></tr>`;
    }
  }

  $('refresh').onclick = load;

  $('scan').onclick = async () => {
    const btn = $('scan');
    btn.disabled = true;
    btn.textContent = '扫描中…';
    try {
      const r = await invoke('account_scan');
      const parts = Object.entries(r.by_platform).map(([k, v]) => `${k} ${v}`).join(' · ');
      toast(`扫到 ${r.scanned} 个（新增 ${r.added}）${parts ? '｜' + parts : ''}`);
      if (r.errors && r.errors.length) toast('部分平台失败：' + r.errors.join('；'));
      await load();
    } catch (e) {
      toast('扫描失败：' + e);
    } finally {
      btn.disabled = false;
      btn.textContent = '扫描客户端';
    }
  };

  const PLATFORMS = [
    ['qoder', 'Qoder CN'],
    ['qoder_intl', 'Qoder 国际版'],
    ['workbuddy', 'WorkBuddy 国内版'],
    ['workbuddy_intl', 'WorkBuddy 国际版'],
    ['zcode', 'ZCode'],
  ];

  $('add').onclick = async () => {
    const picked = await ask({
      title: '给哪家客户端添加账号？',
      text: '会先退出该客户端当前的登录状态（原登录态备份在 data/backups/logout/），然后启动客户端停在登录页。\n登录完成后回到这里点「扫描客户端」即可入库。',
      options: PLATFORMS.map(([key, label]) => ({ key, label })),
    });
    if (!picked) return;
    try {
      const msg = await invoke('account_add_prepare', { platform: picked });
      toast(msg);
    } catch (e) {
      let msg = String(e);
      try { const p = JSON.parse(msg); if (p && p.message) msg = p.message; } catch (_) {}
      toast(msg);
    }
  };

  // 平台选择按钮：点一下直接返回平台键
  $('dlg-grid').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (btn) closeDlg(btn.dataset.value);
  });

  (async () => {
    try {
      const [version] = (await invoke('ui_ready')).split('|');
      $('count').textContent = `v${version}`;
    } catch (e) {
      toast('IPC 未就绪：' + e);
    }
    loadWidths();
    load();
  })();
</script>
</body>
</html>
