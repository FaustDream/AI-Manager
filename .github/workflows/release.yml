# v2 的发布流水线：推 v* 标签即构建 1.8 起的双产物并挂到 GitHub Release。
#
# 产物：
#   AI-Manager-<ver>-windows-x64-setup.exe   per-user 安装包（免管理员，卸载保留 data\）
#   AI-Manager-<ver>-windows-x64-portable.zip 免安装 zip（解压即用）
#
# 版本号以 packaging/nsis/ai-manager.nsi 的 PRODUCT_VERSION 为准。发版前须同步五处
#（见 AGENTS.md §6.1）：Cargo.toml、tauri.conf.json、package.json + package-lock.json、
# ai-manager.nsi、README.txt；打 tag 前先改齐再推。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      # 打包前兜底跑一遍门禁：tag 一推产物就出去，本地忘跑测试时这里是最后一道闸
      - name: 后端测试门禁
        run: cargo test --lib --tests --features ts
        working-directory: src-tauri

      - name: 前端测试门禁
        run: npm test

      - name: 构建前端（dist 是 tauri build 的 frontendDist）
        run: npm run build

      # custom-protocol 必须显式带上：否则 release exe 去连 devUrl，用户看到白屏
      - name: 构建 release 可执行
        run: cargo build --release --features custom-protocol
        working-directory: src-tauri

      # release/ 被 .gitignore 忽略，克隆里不存在；makensis 与 Compress-Archive
      # 都不会自动建目录（表现为 NSIS 的 "Can't open output file"）
      - name: 准备产物目录
        run: New-Item -ItemType Directory -Force release | Out-Null

      - name: 打 per-user 安装包
        run: |
          choco install nsis -y --no-progress
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /INPUTCHARSET UTF8 packaging\nsis\ai-manager.nsi

      - name: 打免安装 zip
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $stage = Join-Path $env:RUNNER_TEMP "stage-$ver"
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item src-tauri\target\release\ai-manager.exe $stage
          Copy-Item packaging\nsis\README.txt $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "release\AI-Manager-$ver-windows-x64-portable.zip" -Force

      - name: 生成校验和
        run: |
          Get-ChildItem release -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)"
            } | Set-Content release\SHA256SUMS.txt -Encoding ascii
          Get-Content release\SHA256SUMS.txt

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          # 变更说明由提交记录生成，CHANGELOG.md 仍是人读的正式版本
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
