name: Release

# 推送 v* 标签即发布：Windows 出「安装版 + 免安装版」两个包，Linux / macOS 各出一个
# 免安装包，自动建 Release 并上传。
# 手动触发（workflow_dispatch）只构建、传 artifact，不建 Release，用于验证打包链路。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-14          # Apple Silicon
            platform: macos-arm64

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装 Linux 运行库与 patchelf
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0

      - name: 装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pyside6-essentials>=6.8,<7" "requests>=2.31,<3" "cryptography>=42,<51" \
            -r packaging/requirements-build.txt

      - name: 装 Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: 校验 tag 与 APP_VERSION 一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re, pathlib
          text = pathlib.Path("app/__init__.py").read_text(encoding="utf-8")
          print(re.search(r'APP_VERSION\s*=\s*"([^"]+)"', text).group(1))
          PY
          )
          echo "APP_VERSION=$VERSION  TAG=$GITHUB_REF_NAME"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 app/__init__.py 的 APP_VERSION $VERSION 不一致，先改版本号再打标签"
            exit 1
          fi

      - name: 打包
        run: python packaging/build.py
        env:
          PYTHONIOENCODING: utf-8

      # 安装包靠本机 Inno Setup 生成，缺了不会让 build.py 失败；这里显式卡住，
      # 避免发出去的 Release 少一个产物。
      - name: 校验产物
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ls -lh dist
          test -f dist/*-setup.exe
          test -f dist/*-windows-x64.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 汇总产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出产物
        run: ls -lh artifacts

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            **Windows**：`*-setup.exe` 安装版（装到用户目录，无需管理员）；`*-windows-x64.zip` 免安装，解压双击 `AIManager.exe`。
            **Linux / macOS**：解压即用，实验性构建，客户端相关功能仅 Windows 可用。
            数据写在程序目录的 `data/` 里，换机器整个目录拷走即可。校验和见 `SHA256SUMS.txt`。

      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
