# v2（Rust + Tauri 2）的最小门禁：格式、Lint、契约与单测、类型生成物一致性（D8）。
# 发布流水线在 release.yml（v* 标签触发，产出安装包与免安装 zip）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy（警告即失败）
        run: cargo clippy --all-targets --features ts -- -D warnings

      - name: 测试（含 ts-rs 类型生成）
        run: cargo test --lib --tests --features ts

      - name: 类型生成物与提交物一致（D8）
        run: |
          $status = git status --porcelain -- ../src/lib/types
          if ($status) {
            Write-Host $status
            Write-Host "::error::src/lib/types/ 有未提交的类型生成物——先在本地跑 cargo test --features ts 并提交"
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查与构建
        run: npm run build

      - name: 单元测试（纯函数）
        run: npm test

  # 红线兜底：data/ 与 docs/ 只本机留存，靠 .gitignore 挡不住 `git add -f`
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 敏感目录未入库
        run: |
          leaked=$(git ls-files -- data data-v1-archive docs tools AGENTS.md .sandbox)
          if [ -n "$leaked" ]; then
            echo "$leaked"
            echo "::error::以上路径应仅本机留存，禁止入库（见 .gitignore 与 AGENTS.md 红线）"
            exit 1
          fi
          echo "OK：敏感目录未入库"
